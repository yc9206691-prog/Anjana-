name: 🤖 Build Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:          # Manual trigger from GitHub UI

# ── Concurrency: cancel older builds on same branch ──────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ──────────────────────────────────────────────
      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Java (required by Gradle) ────────────────────────────
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ── 4. Android SDK ──────────────────────────────────────────
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Install Node deps ────────────────────────────────────
      - name: 📦 Install dependencies
        run: npm ci

      # ── 6. Type check ───────────────────────────────────────────
      - name: 🔍 TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true      # ts-nocheck file; don't block build

      # ── 7. Vite build ───────────────────────────────────────────
      - name: 🏗️ Build web assets (Vite)
        run: npm run build
        env:
          NODE_ENV: production

      # ── 8. Capacitor sync ───────────────────────────────────────
      - name: 🔄 Capacitor sync (copy dist → android/app/src/main/assets)
        run: npx cap sync android

      # ── 9. Cache Gradle ─────────────────────────────────────────
      - name: 💾 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 10. Make gradlew executable ─────────────────────────────
      - name: 🔑 Make gradlew executable
        run: chmod +x android/gradlew

      # ── 11. Build Debug APK ─────────────────────────────────────
      - name: 🔨 Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=512m"

      # ── 12. Build Release APK (unsigned) ────────────────────────
      - name: 🚀 Build Release APK (unsigned)
        run: |
          cd android
          ./gradlew assembleRelease \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=512m"
        continue-on-error: true      # Unsigned release is optional

      # ── 13. Sign Release APK (if keystore secret exists) ────────
      - name: 🔐 Sign Release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out android/app/build/outputs/apk/release/iris-atlas-signed.apk \
            "$APK"
          rm /tmp/release.keystore

      # ── 14. Find all APKs ───────────────────────────────────────
      - name: 📋 List built APKs
        run: find android/app/build/outputs/apk -name "*.apk" | sort

      # ── 15. Upload Debug APK artifact ───────────────────────────
      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iris-atlas-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # ── 16. Upload Release APK artifact ─────────────────────────
      - name: 📤 Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: iris-atlas-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      # ── 17. Create GitHub Release on tag push ───────────────────
      - name: 🏷️ Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: I.R.I.S ATLAS AI ${{ github.ref_name }}
          body: |
            ## 🤖 I.R.I.S ATLAS AI ${{ github.ref_name }}

            **Intelligent Responsive Interactive System** by Yash Chaudhary

            ### 📦 Downloads
            - `iris-atlas-debug.apk` — Debug build (install directly, no signing required)
            - `iris-atlas-release.apk` — Release build (may need manual signing)

            ### ⚠️ Installation
            Enable **"Install from unknown sources"** on your Android device before installing.

            ### 🔑 Features
            - Google Gemini AI + Pollinations AI (free, no key needed)
            - Multi-mode: Normal · Friendly · Pro · Study · Game
            - Voice input, image generation, web search
            - I.R.I.S NEO self-repair engine
            - Dark/light theme, offline capable
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Notify on failure ──────────────────────────────────────────────
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: build-apk
    if: failure()
    steps:
      - name: ❌ Build failed
        run: |
          echo "::error::APK build failed! Check the logs above for details."
          echo "Common fixes:"
          echo "  1. Run 'npx cap add android' locally and commit the android/ folder"
          echo "  2. Ensure package.json dependencies are correct"
          echo "  3. Check Vite build errors"
